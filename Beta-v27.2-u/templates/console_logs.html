{% extends 'layout.html' %}

{% block title %}Server Console Logs{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row mb-3">
        <div class="col-12 d-flex align-items-center justify-content-between flex-wrap gap-2">
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-terminal fs-5 text-info"></i>
                <h5 class="mb-0">Server Console Logs</h5>
                <span id="live-badge" class="badge bg-success ms-1">
                    <i class="fas fa-circle fa-xs me-1"></i>LIVE
                </span>
            </div>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <select id="level-filter" class="form-select form-select-sm" style="width:130px">
                    <option value="ALL">All Levels</option>
                    <option value="DEBUG">DEBUG+</option>
                    <option value="INFO" selected>INFO+</option>
                    <option value="WARNING">WARNING+</option>
                    <option value="ERROR">ERROR+</option>
                    <option value="CRITICAL">CRITICAL</option>
                </select>
                <input id="search-filter" type="text" class="form-control form-control-sm" placeholder="Filter text…" style="width:180px">
                <button id="pause-btn" class="btn btn-sm btn-outline-warning">
                    <i class="fas fa-pause me-1"></i>Pause
                </button>
                <button id="clear-btn" class="btn btn-sm btn-outline-secondary">
                    <i class="fas fa-trash me-1"></i>Clear
                </button>
                <button id="scroll-btn" class="btn btn-sm btn-outline-info" title="Scroll to bottom">
                    <i class="fas fa-arrow-down me-1"></i>Bottom
                </button>
            </div>
        </div>
    </div>

    <!-- Stats bar -->
    <div class="row mb-2">
        <div class="col-12">
            <div class="d-flex gap-3 small">
                <span class="text-muted">Lines shown: <strong id="count-shown">0</strong></span>
                <span class="text-warning">Warnings: <strong id="count-warn">0</strong></span>
                <span class="text-danger">Errors: <strong id="count-err">0</strong></span>
                <span class="text-muted ms-auto" id="last-update"></span>
            </div>
        </div>
    </div>

    <!-- Log terminal -->
    <div class="row">
        <div class="col-12">
            <div class="card border-0" style="background:#0d1117;">
                <div class="card-body p-0">
                    <pre id="log-output"
                         style="
                            height: 68vh;
                            overflow-y: auto;
                            margin: 0;
                            padding: 12px 14px;
                            font-family: 'Consolas','Courier New',monospace;
                            font-size: 12.5px;
                            line-height: 1.55;
                            color: #c9d1d9;
                            background: #0d1117;
                            border-radius: 6px;
                            white-space: pre-wrap;
                            word-break: break-all;
                         "></pre>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.log-debug    { color: #6e7681; }
.log-info     { color: #c9d1d9; }
.log-warning  { color: #e3b341; }
.log-error    { color: #ff7b72; }
.log-critical { color: #ff0000; font-weight: bold; }
.log-highlight { background: rgba(227,179,65,.18); }

#log-output::-webkit-scrollbar { width: 6px; }
#log-output::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
</style>

<script>
(function () {
    const output    = document.getElementById('log-output');
    const pauseBtn  = document.getElementById('pause-btn');
    const clearBtn  = document.getElementById('clear-btn');
    const scrollBtn = document.getElementById('scroll-btn');
    const levelSel  = document.getElementById('level-filter');
    const searchInp = document.getElementById('search-filter');
    const liveBadge = document.getElementById('live-badge');
    const lastUpd   = document.getElementById('last-update');
    const cntShown  = document.getElementById('count-shown');
    const cntWarn   = document.getElementById('count-warn');
    const cntErr    = document.getElementById('count-err');

    let lastTs      = 0;
    let paused      = false;
    let autoScroll  = true;
    let allLines    = [];      // master buffer
    let warnCount   = 0;
    let errCount    = 0;

    const LEVEL_CLASS = {
        DEBUG:    'log-debug',
        INFO:     'log-info',
        WARNING:  'log-warning',
        ERROR:    'log-error',
        CRITICAL: 'log-critical',
    };

    function escHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderLines() {
        const search = searchInp.value.toLowerCase();
        let html = '';
        let shown = 0;
        for (const e of allLines) {
            let line = escHtml(e.msg);
            if (search && !e.msg.toLowerCase().includes(search)) continue;
            const cls = LEVEL_CLASS[e.level] || 'log-info';
            const hl  = search ? ' log-highlight' : '';
            html += `<span class="${cls}${hl}">${line}</span>\n`;
            shown++;
        }
        output.innerHTML = html;
        cntShown.textContent = shown;
        if (autoScroll) output.scrollTop = output.scrollHeight;
    }

    function fetchLogs() {
        if (paused) return;
        const level = levelSel.value;
        const url = `/admin/api/console-logs?since=${lastTs}&limit=300&level=${level}`;
        fetch(url)
            .then(r => r.json())
            .then(data => {
                if (data.lines && data.lines.length > 0) {
                    for (const e of data.lines) {
                        allLines.push(e);
                        if (e.level === 'WARNING') warnCount++;
                        if (e.level === 'ERROR' || e.level === 'CRITICAL') errCount++;
                    }
                    // Keep buffer at max 800 entries
                    if (allLines.length > 800) allLines = allLines.slice(allLines.length - 800);
                    lastTs = data.last_ts;
                    cntWarn.textContent = warnCount;
                    cntErr.textContent  = errCount;
                    renderLines();
                }
                const now = new Date();
                lastUpd.textContent = 'Last update: ' + now.toLocaleTimeString();
            })
            .catch(() => {
                liveBadge.className = 'badge bg-danger ms-1';
                liveBadge.innerHTML = '<i class="fas fa-circle fa-xs me-1"></i>OFFLINE';
            });
    }

    // Initial load — get last 200 lines
    fetch(`/admin/api/console-logs?since=0&limit=200&level=${levelSel.value}`)
        .then(r => r.json())
        .then(data => {
            if (data.lines) {
                allLines = data.lines;
                for (const e of data.lines) {
                    if (e.level === 'WARNING') warnCount++;
                    if (e.level === 'ERROR' || e.level === 'CRITICAL') errCount++;
                }
                lastTs = data.last_ts || 0;
                cntWarn.textContent = warnCount;
                cntErr.textContent  = errCount;
                renderLines();
                output.scrollTop = output.scrollHeight;
            }
        });

    // Poll every 3 seconds
    const timer = setInterval(fetchLogs, 3000);

    // Pause / resume
    pauseBtn.addEventListener('click', () => {
        paused = !paused;
        if (paused) {
            pauseBtn.innerHTML = '<i class="fas fa-play me-1"></i>Resume';
            pauseBtn.classList.replace('btn-outline-warning', 'btn-outline-success');
            liveBadge.className = 'badge bg-warning text-dark ms-1';
            liveBadge.innerHTML = '<i class="fas fa-pause fa-xs me-1"></i>PAUSED';
        } else {
            pauseBtn.innerHTML = '<i class="fas fa-pause me-1"></i>Pause';
            pauseBtn.classList.replace('btn-outline-success', 'btn-outline-warning');
            liveBadge.className = 'badge bg-success ms-1';
            liveBadge.innerHTML = '<i class="fas fa-circle fa-xs me-1"></i>LIVE';
            fetchLogs();
        }
    });

    // Clear
    clearBtn.addEventListener('click', () => {
        allLines   = [];
        warnCount  = 0;
        errCount   = 0;
        lastTs     = Date.now() / 1000;
        output.innerHTML = '';
        cntShown.textContent = '0';
        cntWarn.textContent  = '0';
        cntErr.textContent   = '0';
    });

    // Scroll to bottom
    scrollBtn.addEventListener('click', () => {
        output.scrollTop = output.scrollHeight;
        autoScroll = true;
    });

    // If user scrolls up, stop auto-scroll
    output.addEventListener('scroll', () => {
        const atBottom = output.scrollHeight - output.scrollTop - output.clientHeight < 40;
        autoScroll = atBottom;
    });

    // Re-render when filter changes
    levelSel.addEventListener('change', () => {
        allLines  = [];
        warnCount = 0;
        errCount  = 0;
        lastTs    = 0;
        output.innerHTML = '';
        fetchLogs();
    });
    searchInp.addEventListener('input', renderLines);
})();
</script>
{% endblock %}
